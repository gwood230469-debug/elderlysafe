apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'expo.modules.callscreening'
version = '1.0.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()

android {
  namespace "expo.modules.callscreening"
  // Recent Android Gradle Plugin versions require every module to declare
  // its own compileSdk rather than inheriting one implicitly from the root
  // project — this must be kept in sync with the app's own compileSdk
  // (currently 36, resolved from the installed Expo SDK 57 defaults).
  compileSdk 36
  defaultConfig {
    // CallScreeningService / RoleManager.ROLE_CALL_SCREENING requires API 29+
    minSdkVersion 29
    targetSdkVersion 36
  }
}

dependencies {
  implementation "androidx.core:core-ktx:1.13.1"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
}
